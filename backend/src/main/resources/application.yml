spring:
  application:
    name: flaglane

  # Two identities against one database (ADR-016). The URL and role names are not secrets and
  # default to the Compose stack; the passwords have no default, so an unset one fails startup
  # with the variable name in the message rather than connecting as something unintended.
  datasource:
    # The running application. Holds no DDL privileges.
    url: ${FLAGLANE_DB_URL:jdbc:postgresql://localhost:5432/flaglane}
    username: ${FLAGLANE_DB_APP_USER:flaglane_app}
    password: ${FLAGLANE_DB_APP_PASSWORD}
  flyway:
    # Startup migration only. Owns the schema. Shares the datasource URL above.
    user: ${FLAGLANE_DB_MIGRATOR_USER:flaglane_migrator}
    password: ${FLAGLANE_DB_MIGRATOR_PASSWORD}

  jpa:
    # Flyway owns the schema. Hibernate checks its mappings against it at startup and changes
    # nothing, so a mapping that drifts from a migration fails the deploy, not a request.
    hibernate:
      ddl-auto: validate
    # A transaction ends when the service method returns. Lazy loading from a controller would
    # hide queries outside it.
    open-in-view: false

  mvc:
    # RFC 9457 Problem Details for every error the framework raises (docs/API.md).
    problemdetails:
      enabled: true

  jackson:
    deserialization:
      # Jackson truncates 12.5 to 12 for an integer field by default. A rollout percentage is an
      # integer on both sides of the API (CLAUDE.md, ADR-011): a fraction is refused, not rounded.
      accept-float-as-int: false

flaglane:
  security:
    jwt:
      # HS256 signing key for dashboard access tokens (ADR-021). No default: an unset secret fails
      # startup with the variable named. At least 32 bytes; `openssl rand -base64 48` makes one.
      secret: ${FLAGLANE_JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Serve /actuator/health/liveness and /readiness outside Kubernetes as well.
      probes:
        enabled: true
      # Component names and statuses (db: UP) without connection details.
      show-components: always
      group:
        # NFR-REL-003: readiness never includes the database. A database outage must not have
        # an orchestrator evict the instance while it can still serve from cache. Slice 2.7 adds
        # the ruleset cache indicator here; it is the only thing readiness should depend on.
        readiness:
          include: readinessState
