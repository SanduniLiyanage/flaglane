# Release: publishes the API image to GitHub's container registry when a version tag is pushed.
#
# Each platform is built on a runner of its own architecture rather than under emulation, pushed by
# digest, and the two are then joined into one image tagged with the version (0.1.0), its minor
# line (0.1) and latest (ADR-038). BuildKit attaches a provenance attestation and an SBOM to each
# platform's image. Run by hand, the workflow builds both platforms and publishes nothing, which is
# how a change to the Dockerfile or to this file is tried before a tag depends on it.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Only a pushed version tag publishes anything.
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Image for ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Name the image
        run: |
          # Registry names are lower case; the repository owner's name is not.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # Labels only: the tags are given when the platforms are joined.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/setup-buildx-action@v4

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}

      - name: Keep the digest for the join
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the multi-platform image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # A v0.x tag gives the version and the minor line; latest follows the highest release.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source annotation links the package to this repository on GitHub, and the description
      # is what the package page shows for a multi-platform image.
      - name: Join the platforms under the release's tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while read -r tag; do tags+=(--tag "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=Flaglane API and dashboard: feature flags and remote configuration, self-hosted" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            "${sources[@]}"

      - name: Show what was published
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
